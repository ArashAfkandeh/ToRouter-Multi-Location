                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"

            <div
              class="flex-1 overflow-hidden flex flex-col"
              x-data="{
                        logs: [],
                        levelFilter: 'ALL',
                        loading: false,
                        init() {
                            this.$watch('logsModalOpen', val => {
                                // Initially, logs will be populated by the WS event but we can let it wait
                            });
                        },
                        handleWsUpdate(e) {
                            if (e.detail && e.detail.length) {
                                this.logs = e.detail;
                                this.$nextTick(() => {
                                    const container = this.$refs.logsContainer;
                                    // only auto-scroll if we are already near the bottom
                                    if(container && (container.scrollHeight - container.scrollTop - container.clientHeight < 50)) {
                                        container.scrollTop = container.scrollHeight;
                                    }
                                });
                            }
                        },
                        get filteredLogs() {
                            if (this.levelFilter === 'ALL') return this.logs;
                            return this.logs.filter(l => l.includes(` ${this.levelFilter} `));
                        },
                        async fetchLogs() {
                            this.loading = true;
                            try {
                                const res = await window.logsService.fetchLogs();
                                if (!res.error && res.data) {
                                    const logsArray = Array.isArray(res.data) ? res.data : res.data.split('\n');
                                    this.logs = logsArray.filter(l => l && l.trim().length > 0);
                                    this.$nextTick(() => {
                                        const container = this.$refs.logsContainer;
                                        if (container) {
                                            container.scrollTop = container.scrollHeight;
                                        }
                                    });
                                }
                            } finally {
                                this.loading = false;
                            }
                        },
                        copy() {
                            navigator.clipboard.writeText(this.filteredLogs.join('\n'));
                            $store.toast.show($store.app.t('copied_to_clipboard'), 'success');
                        }
                    }"
              @logs-updated.window="handleWsUpdate($event)"

                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"

                      <path

                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                      />
                    </svg>
                    Copy
                  </button>
                  <button
                    @click="fetchLogs()"
                    class="px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors flex items-center gap-1.5 shadow-sm"
                  >
                    <svg
                      class="w-3.5 h-3.5"
                      :class="{'animate-spin': loading}"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                      />
                    </svg>
                    Refresh
                  </button>
                </div>
              </div>
              <div
                x-ref="logsContainer"
                class="flex-1 p-4 bg-[#1e1e1e] overflow-y-auto font-mono text-[13px] leading-relaxed relative text-slate-300 h-[50vh]"
              >
                <div
                  x-show="loading"
                  class="absolute inset-0 bg-[#1e1e1e]/50 backdrop-blur-sm flex items-center justify-center z-10"
                >
                  <svg
                    class="w-8 h-8 text-brand-500 animate-spin"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                    />
                  </svg>
                </div>
                <template x-for="(log, idx) in filteredLogs" :key="idx">
                  <div
                    class="py-0.5 border-b border-white/5 hover:bg-white/5 transition-colors whitespace-pre-wrap break-all"

                                        'text-red-400': log.includes(' ERROR '),

                                        'text-emerald-400': log.includes(' INFO '),

                </template>
                <div
                  x-show="filteredLogs.length === 0"
                  class="text-center text-slate-500 py-8"
                >
                  No logs found
                </div>
              </div>
            </div>
          </div>
        </div>
